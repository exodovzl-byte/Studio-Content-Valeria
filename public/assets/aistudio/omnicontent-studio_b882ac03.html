    const Icon = ({ name, className = "w-4 h-4", strokeWidth = 1.8 }) => {
      const ref = useRef(null);
      useEffect(() => {
        if (!ref.current || !window.lucide) return;
        const kebab = name
          .replace(/([a-z0-9])([A-Z])/g, '$1-$2')
          .toLowerCase();
        const iconDef = window.lucide.icons?.[kebab] || window.lucide[name];
        if (!iconDef) {
          ref.current.innerHTML = '';
          return;
        }
        const svgEl = window.lucide.createElement(iconDef);
        svgEl.setAttribute('class', className);
        svgEl.setAttribute('stroke-width', String(strokeWidth));
        ref.current.innerHTML = '';
        ref.current.appendChild(svgEl);
      }, [name, className, strokeWidth]);
      return <span ref={ref} className="inline-flex items-center justify-center shrink-0" />;
    };

        const handleClickOutside = (e) => {
          if (ref.current && !ref.current.contains(e.target)) setOpen(false);

        document.addEventListener('mousedown', handleClickOutside);
        return () => document.removeEventListener('mousedown', handleClickOutside);
      }, []);

        <div className="relative" ref={ref}>

            onClick={() => setOpen((prev) => !prev)}

      const [viewDate, setViewDate] = useState(() => new Date(CUR_Y, CUR_M, 1));
      const [colorBy, setColorBy] = useState('platform'); // 'platform' | 'status'
      const [selectedType, setSelectedType] = useState('Todos');

      const month = viewDate.getMonth();

      const monthLabel = viewDate.toLocaleDateString('es-ES', { month: 'long', year: 'numeric' });

      const mondayOffset = firstDayIndex === 0 ? 6 : firstDayIndex - 1;
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      const filteredPosts = useMemo(() => {
        return posts.filter((p) => (selectedType === 'Todos' ? true : p.contentType === selectedType));
      }, [posts, selectedType]);

      const postsByDate = useMemo(() => {
        const map = {};
        filteredPosts.forEach((p) => {
          if (!p.date) return;
          if (!map[p.date]) map[p.date] = [];
          map[p.date].push(p);
        });
        Object.keys(map).forEach((k) => {
          map[k].sort((a, b) => (a.time || '').localeCompare(b.time || ''));
        });
        return map;
      }, [filteredPosts]);

      const cells = useMemo(() => {
        const list = [];
        for (let i = 0; i < mondayOffset; i++) list.push({ type: 'empty', key: `empty-${i}` });
        for (let d = 1; d <= daysInMonth; d++) {
          const key = formatDateKey(year, month, d);
          list.push({ type: 'day', day: d, key });
        }
        while (list.length % 7 !== 0) {
          list.push({ type: 'empty', key: `tail-${list.length}` });
        }
        return list;
      }, [year, month, mondayOffset, daysInMonth]);

      const todayKey = formatDateKey(todayObj.getFullYear(), todayObj.getMonth(), todayObj.getDate());

    // 4. Vista de Retícula / Feed Visual (Reordenable por Drag & Drop o botones)
    const GridPreviewView = ({ posts, brand, onReorderFeed, onSelectPost, compact = false }) => {
      const [dragId, setDragId] = useState(null);

      const orderedPosts = useMemo(() => {
        return [...posts].sort((a, b) => (a.feedOrder ?? 999) - (b.feedOrder ?? 999));
      }, [posts]);

      const handleDropOnPost = (e, targetId) => {
        e.preventDefault();
        const sourceId = e.dataTransfer.getData('text/plain') || dragId;
        if (!sourceId || sourceId === targetId) return;
        const ids = orderedPosts.map((p) => p.id);
        const fromIdx = ids.indexOf(sourceId);
        const toIdx = ids.indexOf(targetId);
        if (fromIdx === -1 || toIdx === -1) return;
        ids.splice(fromIdx, 1);
        ids.splice(toIdx, 0, sourceId);
        onReorderFeed(ids);
        setDragId(null);
      };

      const swapAdjacent = (e, index, delta) => {
        e.stopPropagation();
        const targetIndex = index + delta;
        if (targetIndex < 0 || targetIndex >= orderedPosts.length) return;
        const ids = orderedPosts.map((p) => p.id);
        const temp = ids[index];
        ids[index] = ids[targetIndex];
        ids[targetIndex] = temp;
        onReorderFeed(ids);
      };

      return (
        <div
          className={`bg-white dark:bg-zinc-900/70 border border-slate-200 dark:border-zinc-800/80 rounded-2xl ${
            compact ? 'p-3' : 'p-5 max-w-4xl mx-auto'
          }`}
        >
          {/* Cabecera estilo perfil de Instagram */}
          <div className="flex items-center justify-between gap-3 pb-4 mb-4 border-b border-slate-100 dark:border-zinc-800/80">
            <div className="flex items-center gap-3">
              <div
                className="w-11 h-11 rounded-full flex items-center justify-center text-white font-bold text-sm shrink-0 ring-2 ring-offset-2 ring-offset-white dark:ring-offset-zinc-900"
                style={{ backgroundColor: brand?.accent || '#18181b', '--tw-ring-color': brand?.accent || '#6366f1' }}
              >
                {brand?.badge || 'OM'}
              </div>
              <div>
                <div className="text-sm font-semibold">{brand?.name || 'Feed Visual'}</div>
                <div className="text-[11px] text-slate-500 dark:text-zinc-400">
                  {orderedPosts.length} publicaciones · Arrastra para curar la estética
                </div>
              </div>
            </div>
            <span className="hidden sm:inline-flex items-center gap-1 text-[11px] px-2.5 py-1 rounded-full bg-slate-100 dark:bg-zinc-800 text-slate-600 dark:text-zinc-300">
              <Icon name="Sparkles" className="w-3 h-3 text-indigo-500" />
              Simulador Feed 3:4
            </span>
          </div>

          {/* Retícula 3 columnas */}
          <div className="grid grid-cols-3 gap-1.5 sm:gap-2.5">
            {orderedPosts.map((post, idx) => (
              <div
                key={post.id}
                draggable
                onDragStart={(e) => {
                  setDragId(post.id);
                  e.dataTransfer.setData('text/plain', post.id);
                }}
                onDragOver={(e) => e.preventDefault()}
                onDrop={(e) => handleDropOnPost(e, post.id)}
                onClick={() => onSelectPost(post.id)}
                className="group relative aspect-[3/4] rounded-lg overflow-hidden bg-slate-100 dark:bg-zinc-800 border border-slate-200/60 dark:border-zinc-800 cursor-grab active:cursor-grabbing"
              >
                {post.coverUrl ? (
                  <img
                    src={post.coverUrl}
                    alt={post.title}
                    className="w-full h-full object-cover group-hover:scale-105 transition duration-300"
                  />
                ) : (
                  <div className="w-full h-full p-2.5 flex flex-col justify-between bg-gradient-to-br from-slate-100 to-slate-200 dark:from-zinc-800 dark:to-zinc-900">
                    <span className="text-[10px] font-semibold uppercase tracking-wider text-slate-400">
                      {post.contentType}
                    </span>
                    <p className="text-xs font-semibold line-clamp-3">{post.title}</p>
                  </div>
                )}

                {/* Indicador superior */}
                <div className="absolute top-1.5 right-1.5 flex items-center gap-1">
                  <span className="px-1.5 py-0.5 rounded bg-black/60 text-white text-[9px] font-medium backdrop-blur-xs">
                    #{idx + 1}
                  </span>
                </div>

                {/* Overlay hover */}
                <div className="absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 transition p-2 flex flex-col justify-between text-white">
                  <div className="flex items-center justify-between gap-1">
                    <button
                      type="button"
                      disabled={idx === 0}
                      onClick={(e) => swapAdjacent(e, idx, -1)}
                      className="p-1 rounded bg-white/15 hover:bg-white/30 disabled:opacity-25"
                      title="Mover antes"
                    >
                      <Icon name="ChevronLeft" className="w-3 h-3" />
                    </button>
                    <button
                      type="button"
                      disabled={idx === orderedPosts.length - 1}
                      onClick={(e) => swapAdjacent(e, idx, 1)}
                      className="p-1 rounded bg-white/15 hover:bg-white/30 disabled:opacity-25"
                      title="Mover después"
                    >
                      <Icon name="ChevronRight" className="w-3 h-3" />
                    </button>
                  </div>
                  <div>
                    <p className="text-[11px] font-semibold line-clamp-2 leading-snug">{post.title}</p>
                    <p className="text-[10px] text-white/75 mt-0.5">
                      {post.platform} · {post.contentType}
                    </p>
                  </div>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    };

    // 5. Modal de Detalle de Tarjeta / Contenido Avanzado
    const ContentDetailModal = ({ post, onClose, onUpdatePost, onDeletePost }) => {
      const [newTaskText, setNewTaskText] = useState('');
      const [commentAuthor, setCommentAuthor] = useState('Andrés');
      const [commentText, setCommentText] = useState('');
      const fileInputRef = useRef(null);

      if (!post) return null;

      const handleField = (field, value) => {
        onUpdatePost(post.id, { [field]: value });
      };

      const handleFileUpload = (e) => {
        const files = Array.from(e.target.files || []);
        if (!files.length) return;
        const created = files.map((file) => {
          const url = URL.createObjectURL(file);
          const isVideo = file.type.startsWith('video/');
          return {
            id: `media-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,
            name: file.name,
            type: isVideo ? 'video' : 'image',
            url,
          };
        });
        const nextMedia = [...(post.mediaItems || []), ...created];
        const firstImage = nextMedia.find((m) => m.type === 'image');
        onUpdatePost(post.id, {
          mediaItems: nextMedia,
          coverUrl: firstImage ? firstImage.url : post.coverUrl,
        });
        e.target.value = '';
      };

      const removeMedia = (mediaId) => {
        const nextMedia = (post.mediaItems || []).filter((m) => m.id !== mediaId);
        const firstImage = nextMedia.find((m) => m.type === 'image');
        onUpdatePost(post.id, {
          mediaItems: nextMedia,
          coverUrl: firstImage ? firstImage.url : '',
        });
      };

      const addChecklistItem = (e) => {
        e.preventDefault();
        if (!newTaskText.trim()) return;
        const item = {
          id: `chk-${Date.now()}`,
          text: newTaskText.trim(),
          done: false,
        };
        onUpdatePost(post.id, { checklist: [...(post.checklist || []), item] });
        setNewTaskText('');
      };

      const toggleChecklistItem = (itemId) => {
        const updated = (post.checklist || []).map((i) =>
          i.id === itemId ? { ...i, done: !i.done } : i
        );
        onUpdatePost(post.id, { checklist: updated });
      };

      const deleteChecklistItem = (itemId) => {
        const updated = (post.checklist || []).filter((i) => i.id !== itemId);
        onUpdatePost(post.id, { checklist: updated });
      };

      const addComment = (e) => {
        e.preventDefault();
        if (!commentText.trim()) return;
        const newComment = {
          id: `cmt-${Date.now()}`,
          author: commentAuthor,
          text: commentText.trim(),
          time: 'Ahora mismo',
        };
        onUpdatePost(post.id, { comments: [...(post.comments || []), newComment] });
        setCommentText('');
      };

      const doneCount = post.checklist?.filter((c) => c.done).length || 0;
      const totalCount = post.checklist?.length || 0;

      return (
        <div
          className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-6 bg-black/60 backdrop-blur-xs"
          onClick={onClose}
        >
          <div
            className="w-full max-w-4xl max-h-[92vh] rounded-2xl border border-slate-200 dark:border-zinc-800 bg-white dark:bg-zinc-900 shadow-2xl flex flex-col overflow-hidden"

          >
            {/* Cabecera del modal */}
            <div className="flex items-center justify-between gap-3 px-5 py-3.5 border-b border-slate-200 dark:border-zinc-800">
              <div className="flex items-center gap-2 min-w-0 flex-1">
                <span className="text-xs font-medium text-slate-400">Pieza:</span>
                <input
                  type="text"
                  value={post.title}
                  onChange={(e) => handleField('title', e.target.value)}

                />
              </div>
              <div className="flex items-center gap-1.5 shrink-0">
                <button
                  type="button"
                  onClick={() => {
                    onDeletePost(post.id);
                    onClose();

                  <Icon name="Trash2" className="w-4 h-4" />

                <button

                  <Icon name="X" className="w-4 h-4" />

              </div>
            </div>

            {/* Cuerpo en dos columnas */}
            <div className="flex-1 overflow-y-auto grid grid-cols-1 lg:grid-cols-12 divide-y lg:divide-y-0 lg:divide-x divide-slate-200 dark:divide-zinc-800">
              {/* Columna Izquierda: Copy, CTA, Hashtags, Notas y Multimedia */}
              <div className="lg:col-span-7 p-5 space-y-5">
                {/* Multimedia */}
                <div>
                  <div className="flex items-center justify-between mb-2">
                    <label className="text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-zinc-400 flex items-center gap-1.5">

                    <button

                      <Icon name="Upload" className="w-3.5 h-3.5" />

                  <div className="grid grid-cols-2 sm:grid-cols-3 gap-2.5">
                    {post.coverUrl && (!post.mediaItems || post.mediaItems.length === 0) && (
                      <div className="relative aspect-square rounded-xl overflow-hidden border border-slate-200 dark:border-zinc-800 bg-slate-100 dark:bg-zinc-800">
                        <img src={post.coverUrl} alt="Portada" className="w-full h-full object-cover" />
                        <span className="absolute bottom-1.5 left-1.5 text-[10px] px-1.5 py-0.5 rounded bg-black/60 text-white">
                          Portada

                      </div>

                    {(post.mediaItems || []).map((item) => (
                      <div
                        key={item.id}
                        className="group relative aspect-square rounded-xl overflow-hidden border border-slate-200 dark:border-zinc-800 bg-slate-100 dark:bg-zinc-800"

                        {item.type === 'video' ? (
                          <video src={item.url} controls className="w-full h-full object-cover" />

                          <img src={item.url} alt={item.name} className="w-full h-full object-cover" />

                        <button

                    {!post.coverUrl && (!post.mediaItems || post.mediaItems.length === 0) && (
                      <button

                {/* CTA y Hashtags */}
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">

                    <textarea

                      className="w-full rounded-xl border border-slate-200 dark:border-zinc-800 bg-slate-50/70 dark:bg-zinc-950/60 p-2.5 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500/40"

                  <div>
                    <label className="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-zinc-400 mb-1.5">

                    </label>
                    <textarea
                      rows={2}
                      value={post.hashtags || ''}
                      onChange={(e) => handleField('hashtags', e.target.value)}

                      className="w-full rounded-xl border border-slate-200 dark:border-zinc-800 bg-slate-50/70 dark:bg-zinc-950/60 p-2.5 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500/40"
                    />

                </div>

                {/* Notas internas de producción */}
                <div>
                  <label className="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-zinc-400 mb-1.5">

                    rows={2}
                    value={post.internalNotes || ''}

                    placeholder="Especificaciones técnicas, referencias de color, tiempos..."

                  />
                </div>
              </div>

              {/* Columna Derecha: Metadatos, Checklist y Comentarios */}
              <div className="lg:col-span-5 p-5 space-y-5 bg-slate-50/50 dark:bg-zinc-950/30">
                {/* Propiedades */}
                <div className="grid grid-cols-2 gap-2.5 text-xs">
                  <div>
                    <label className="block text-[11px] text-slate-500 dark:text-zinc-400 mb-1">Etapa Kanban</label>
                    <select
                      value={post.status}
                      onChange={(e) => handleField('status', e.target.value)}
                      className="w-full rounded-lg border border-slate-200 dark:border-zinc-800 bg-white dark:bg-zinc-900 px-2.5 py-1.5 font-medium"
                    >
                      {KANBAN_COLUMNS.map((c) => (
                        <option key={c.id} value={c.id}>
                          {c.title}
                        </option>
                      ))}
                    </select>
                  </div>

                  <div>
                    <label className="block text-[11px] text-slate-500 dark:text-zinc-400 mb-1">Plataforma</label>
                    <select
                      value={post.platform}
                      onChange={(e) => handleField('platform', e.target.value)}
                      className="w-full rounded-lg border border-slate-200 dark:border-zinc-800 bg-white dark:bg-zinc-900 px-2.5 py-1.5 font-medium"
                    >
                      {PLATFORMS.map((p) => (
                        <option key={p} value={p}>
                          {p}
                        </option>
                      ))}
                    </select>
                  </div>

                  <div>
                    <label className="block text-[11px] text-slate-500 dark:text-zinc-400 mb-1">Tipo de Contenido</label>
                    <select
                      value={post.contentType}
                      onChange={(e) => handleField('contentType', e.target.value)}
                      className="w-full rounded-lg border border-slate-200 dark:border-zinc-800 bg-white dark:bg-zinc-900 px-2.5 py-1.5 font-medium"
                    >
                      {CONTENT_TYPES.map((t) => (
                        <option key={t} value={t}>
                          {t}
                        </option>
                      ))}
                    </select>
                  </div>

                  <div>
                    <label className="block text-[11px] text-slate-500 dark:text-zinc-400 mb-1">Responsable</label>
                    <select
                      value={post.assignee}
                      onChange={(e) => handleField('assignee', e.target.value)}
                      className="w-full rounded-lg border border-slate-200 dark:border-zinc-800 bg-white dark:bg-zinc-900 px-2.5 py-1.5 font-medium"
                    >
                      {ASSIGNEES.map((a) => (
                        <option key={a} value={a}>
                          {a}
                        </option>
                      ))}
                    </select>
                  </div>

                  <div>
                    <label className="block text-[11px] text-slate-500 dark:text-zinc-400 mb-1">Fecha Límite</label>
                    <input
                      type="date"
                      value={post.date || ''}
                      onChange={(e) => handleField('date', e.target.value)}
                      className="w-full rounded-lg border border-slate-200 dark:border-zinc-800 bg-white dark:bg-zinc-900 px-2.5 py-1.5"
                    />
                  </div>

                  <div>
                    <label className="block text-[11px] text-slate-500 dark:text-zinc-400 mb-1">Hora</label>
                    <input
                      type="time"
                      value={post.time || '18:00'}
                      onChange={(e) => handleField('time', e.target.value)}
                      className="w-full rounded-lg border border-slate-200 dark:border-zinc-800 bg-white dark:bg-zinc-900 px-2.5 py-1.5"
                    />
                  </div>
                </div>

                {/* Checklist de Subtareas */}
                <div className="pt-2 border-t border-slate-200/80 dark:border-zinc-800">
                  <div className="flex items-center justify-between mb-2">
                    <span className="text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-zinc-400">
                      Checklist de Subtareas
                    </span>
                    <span className="text-[11px] font-medium text-indigo-600 dark:text-indigo-400">
                      {doneCount}/{totalCount}
                    </span>
                  </div>

                  <div className="space-y-1.5 mb-2.5">
                    {(post.checklist || []).map((item) => (
                      <div
                        key={item.id}
                        className="flex items-center justify-between gap-2 text-xs bg-white dark:bg-zinc-900 px-2.5 py-1.5 rounded-lg border border-slate-200/70 dark:border-zinc-800"
                      >
                        <label className="flex items-center gap-2 cursor-pointer flex-1 min-w-0">
                          <input
                            type="checkbox"
                            checked={item.done}
                            onChange={() => toggleChecklistItem(item.id)}
                            className="rounded border-slate-300 text-indigo-600 focus:ring-indigo-500"
                          />
                          <span className={item.done ? 'line-through text-slate-400' : 'truncate'}>
                            {item.text}
                          </span>
                        </label>
                        <button
                          type="button"
                          onClick={() => deleteChecklistItem(item.id)}
                          className="text-slate-400 hover:text-rose-500"
                        >
                          <Icon name="X" className="w-3 h-3" />
                        </button>
                      </div>
                    ))}
                  </div>

                  <form onSubmit={addChecklistItem} className="flex gap-1.5">
                    <input
                      type="text"
                      value={newTaskText}
                      onChange={(e) => setNewTaskText(e.target.value)}
                      placeholder="Nueva subtarea (ej. Programar en Meta Business Suite)..."
                      className="flex-1 rounded-lg border border-slate-200 dark:border-zinc-800 bg-white dark:bg-zinc-900 px-2.5 py-1.5 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500/40"
                    />
                    <button
                      type="submit"
                      className="px-2.5 py-1.5 rounded-lg bg-slate-900 dark:bg-white text-white dark:text-zinc-950 text-xs font-medium hover:opacity-90"
                    >
                      Añadir
                    </button>
                  </form>
                </div>

                {/* Comentarios y actividad del equipo */}
                <div className="pt-2 border-t border-slate-200/80 dark:border-zinc-800">
                  <span className="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-zinc-400 mb-2">
                    Comentarios del Equipo
                  </span>

                  <div className="space-y-2 max-h-44 overflow-y-auto mb-2.5">
                    {(post.comments || []).map((c) => (
                      <div
                        key={c.id}
                        className="rounded-xl bg-white dark:bg-zinc-900 border border-slate-200/70 dark:border-zinc-800 p-2.5 text-xs"
                      >
                        <div className="flex items-center justify-between mb-1">
                          <span className="font-semibold text-slate-800 dark:text-zinc-200">
                            {c.author}
                          </span>
                          <span className="text-[10px] text-slate-400">{c.time}</span>
                        </div>
                        <p className="text-slate-600 dark:text-zinc-300 leading-snug">{c.text}</p>
                      </div>
                    ))}
                    {(!post.comments || post.comments.length === 0) && (
                      <p className="text-[11px] text-slate-400 italic">Sin comentarios aún.</p>
                    )}
                  </div>

                  <form onSubmit={addComment} className="space-y-1.5">
                    <div className="flex gap-1.5">
                      <select
                        value={commentAuthor}
                        onChange={(e) => setCommentAuthor(e.target.value)}
                        className="rounded-lg border border-slate-200 dark:border-zinc-800 bg-white dark:bg-zinc-900 px-2 py-1.5 text-xs font-medium"
                      >
                        {ASSIGNEES.map((a) => (
                          <option key={a} value={a}>
                            {a}
                          </option>
                        ))}
                      </select>
                      <input
                        type="text"
                        value={commentText}
                        onChange={(e) => setCommentText(e.target.value)}
                        placeholder="Escribir nota o actualización..."
                        className="flex-1 rounded-lg border border-slate-200 dark:border-zinc-800 bg-white dark:bg-zinc-900 px-2.5 py-1.5 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500/40"
                      />
                      <button
                        type="submit"
                        className="px-2.5 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-medium"
                      >
                        Enviar
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    };

    // ==================== APLICACIÓN PRINCIPAL ====================
    function App() {
      const [darkMode, setDarkMode] = useState(true);
      const [selectedBrandId, setSelectedBrandId] = useState('exodo');
      const [activeView, setActiveView] = useState('kanban'); // 'kanban' | 'calendar' | 'grid'
      const [showSideFeed, setShowSideFeed] = useState(true);
      const [searchQuery, setSearchQuery] = useState('');
      const [posts, setPosts] = useState(INITIAL_POSTS);
      const [selectedPostId, setSelectedPostId] = useState(null);

      useEffect(() => {
        const root = document.documentElement;
        if (darkMode) root.classList.add('dark');
        else root.classList.remove('dark');
      }, [darkMode]);

      const currentBrand = useMemo(
        () => BRANDS.find((b) => b.id === selectedBrandId) || BRANDS[0],
        [selectedBrandId]
      );

      const brandPosts = useMemo(() => {
        return posts.filter((p) => {
          if (p.brandId !== selectedBrandId) return false;
          if (!searchQuery.trim()) return true;
          const q = searchQuery.toLowerCase();
          return (
            p.title.toLowerCase().includes(q) ||
            (p.caption || '').toLowerCase().includes(q) ||
            (p.assignee || '').toLowerCase().includes(q) ||
            (p.contentType || '').toLowerCase().includes(q)
          );
        });
      }, [posts, selectedBrandId, searchQuery]);

      const selectedPost = useMemo(
        () => posts.find((p) => p.id === selectedPostId) || null,
        [posts, selectedPostId]
      );

      const createPost = ({ status = 'estrategia', date = formatDateKey(CUR_Y, CUR_M, todayObj.getDate()) } = {}) => {
        const brandItems = posts.filter((p) => p.brandId === selectedBrandId);
        const newId = `post-${Date.now()}`;
        const created = {
          id: newId,
          brandId: selectedBrandId,
          title: 'Nueva pieza de contenido',
          status,
          platform: 'Instagram',
          contentType: 'Reel',
          date,
          time: '18:00',
          assignee: 'Andrés',
          coverUrl: '',
          mediaType: 'image',
          mediaItems: [],
          caption: '',
          hashtags: '',
          cta: '',
          internalNotes: '',
          checklist: [
            { id: `chk-${Date.now()}-1`, text: 'Definir guion y enfoque visual', done: false },
            { id: `chk-${Date.now()}-2`, text: 'Aprobar pieza final', done: false },
          ],
          comments: [],
          feedOrder: brandItems.length,
        };
        setPosts((prev) => [created, ...prev]);
        setSelectedPostId(newId);
      };

      const updatePost = (postId, patch) => {
        setPosts((prev) => prev.map((p) => (p.id === postId ? { ...p, ...patch } : p)));
      };

      const deletePost = (postId) => {
        setPosts((prev) => prev.filter((p) => p.id !== postId));
        if (selectedPostId === postId) setSelectedPostId(null);
      };

      const reorderFeed = (orderedIds) => {
        setPosts((prev) =>
          prev.map((p) => {
            const idx = orderedIds.indexOf(p.id);
            return idx !== -1 ? { ...p, feedOrder: idx } : p;
          })
        );
      };

      return (
        <div className="min-h-screen flex flex-col bg-slate-50 text-slate-900 dark:bg-zinc-950 dark:text-zinc-100">
          {/* Barra Superior */}
          <header className="sticky top-0 z-30 border-b border-slate-200/80 dark:border-zinc-800/80 bg-white/85 dark:bg-zinc-950/85 backdrop-blur-md">
            <div className="max-w-[1600px] mx-auto px-3 sm:px-6 h-14 flex items-center justify-between gap-2.5">
              {/* Izquierda: Logo + Selector de Marca */}
              <div className="flex items-center gap-3 min-w-0">
                <div className="flex items-center gap-2 shrink-0">
                  <div className="w-8 h-8 rounded-lg bg-slate-900 dark:bg-white text-white dark:text-zinc-950 flex items-center justify-center font-bold text-sm">
                    O
                  </div>
                  <span className="font-semibold text-sm tracking-tight hidden md:inline">
                    OmniContent <span className="text-slate-400 font-normal">Studio</span>
                  </span>
                </div>

                <span className="h-4 w-px bg-slate-200 dark:bg-zinc-800 hidden sm:inline" />

                <BrandSelector
                  brands={BRANDS}
                  selectedBrandId={selectedBrandId}
                  onSelectBrand={setSelectedBrandId}
                  darkMode={darkMode}
                />
              </div>

              {/* Centro: Selector de Vistas */}
              <nav className="flex items-center bg-slate-100 dark:bg-zinc-900 p-1 rounded-xl border border-slate-200/70 dark:border-zinc-800">
                <button
                  type="button"
                  onClick={() => setActiveView('kanban')}
                  className={`inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg text-xs font-medium transition ${
                    activeView === 'kanban'
                      ? 'bg-white dark:bg-zinc-800 text-slate-900 dark:text-white shadow-2xs'
                      : 'text-slate-500 dark:text-zinc-400 hover:text-slate-800 dark:hover:text-zinc-200'
                  }`}
                >
                  <Icon name="Kanban" className="w-3.5 h-3.5" />
                  <span className="hidden sm:inline">Kanban</span>
                </button>

                <button
                  type="button"
                  onClick={() => setActiveView('calendar')}
                  className={`inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg text-xs font-medium transition ${
                    activeView === 'calendar'
                      ? 'bg-white dark:bg-zinc-800 text-slate-900 dark:text-white shadow-2xs'
                      : 'text-slate-500 dark:text-zinc-400 hover:text-slate-800 dark:hover:text-zinc-200'
                  }`}
                >
                  <Icon name="Calendar" className="w-3.5 h-3.5" />
                  <span className="hidden sm:inline">Calendario</span>
                </button>

                <button
                  type="button"
                  onClick={() => setActiveView('grid')}
                  className={`inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg text-xs font-medium transition ${
                    activeView === 'grid'
                      ? 'bg-white dark:bg-zinc-800 text-slate-900 dark:text-white shadow-2xs'
                      : 'text-slate-500 dark:text-zinc-400 hover:text-slate-800 dark:hover:text-zinc-200'
                  }`}
                >
                  <Icon name="LayoutGrid" className="w-3.5 h-3.5" />
                  <span className="hidden sm:inline">Feed Visual</span>
                </button>
              </nav>

              {/* Derecha: Buscador, Feed Lateral, Tema y Nueva Pieza */}
              <div className="flex items-center gap-2">
                <div className="relative hidden xl:block w-52">
                  <Icon
                    name="Search"
                    className="w-3.5 h-3.5 text-slate-400 absolute left-2.5 top-1/2 -translate-y-1/2"
                  />
                  <input
                    type="text"
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    placeholder="Buscar pieza o responsable..."
                    className="w-full pl-8 pr-2.5 py-1.5 text-xs rounded-lg border border-slate-200 dark:border-zinc-800 bg-slate-50 dark:bg-zinc-900 focus:outline-none focus:ring-2 focus:ring-indigo-500/40"
                  />
                </div>

                {activeView !== 'grid' && (
                  <button
                    type="button"
                    onClick={() => setShowSideFeed((s) => !s)}
                    className={`hidden lg:inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg text-xs font-medium border transition ${
                      showSideFeed
                        ? 'border-indigo-500/40 bg-indigo-500/10 text-indigo-600 dark:text-indigo-400'
                        : 'border-slate-200 dark:border-zinc-800 bg-white dark:bg-zinc-900 text-slate-600 dark:text-zinc-300'
                    }`}
                    title="Alternar simulador de feed lateral"
                  >
                    <Icon name="PanelRight" className="w-3.5 h-3.5" />
                    Feed
                  </button>
                )}

                <button
                  type="button"
                  onClick={() => setDarkMode((d) => !d)}
                  className="p-2 rounded-lg border border-slate-200 dark:border-zinc-800 bg-white dark:bg-zinc-900 hover:bg-slate-100 dark:hover:bg-zinc-800 transition"
                  title={darkMode ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'}
                >
                  <Icon name={darkMode ? 'Sun' : 'Moon'} className="w-4 h-4" />
                </button>

                <button
                  type="button"
                  onClick={() => createPost({ status: 'estrategia' })}
                  className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold bg-indigo-600 hover:bg-indigo-500 text-white shadow-2xs transition"
                >
                  <Icon name="Plus" className="w-3.5 h-3.5" />
                  <span>Nueva Pieza</span>
                </button>
              </div>
            </div>
          </header>

          {/* Contenido Principal */}
          <main className="flex-1 max-w-[1600px] w-full mx-auto px-3 sm:px-6 py-4">
            <div className="flex flex-col lg:flex-row gap-5 items-start">
              {/* Área principal de trabajo */}
              <div className="flex-1 min-w-0 w-full">
                {activeView === 'kanban' && (
                  <KanbanBoard
                    posts={brandPosts}
                    onMovePost={(postId, nextStatus) => updatePost(postId, { status: nextStatus })}
                    onSelectPost={(postId) => setSelectedPostId(postId)}
                    onQuickCreateInColumn={(colId) => createPost({ status: colId })}
                  />
                )}

                {activeView === 'calendar' && (
                  <CalendarView
                    posts={brandPosts}
                    onSelectPost={(postId) => setSelectedPostId(postId)}
                    onQuickCreate={(dateStr) => createPost({ status: 'programado', date: dateStr })}
                  />
                )}

                {activeView === 'grid' && (
                  <GridPreviewView
                    posts={brandPosts}
                    brand={currentBrand}
                    onReorderFeed={reorderFeed}
                    onSelectPost={(postId) => setSelectedPostId(postId)}
                  />
                )}
              </div>

              {/* Panel lateral de Retícula / Feed Visual en vistas Kanban y Calendario */}
              {activeView !== 'grid' && showSideFeed && (
                <aside className="w-full lg:w-80 xl:w-96 shrink-0 lg:sticky lg:top-20">
                  <GridPreviewView
                    posts={brandPosts}
                    brand={currentBrand}
                    onReorderFeed={reorderFeed}
                    onSelectPost={(postId) => setSelectedPostId(postId)}
                    compact
                  />
                </aside>
              )}
            </div>
          </main>

          {/* Modal Avanzado de Detalle */}
          <ContentDetailModal
            post={selectedPost}
            onClose={() => setSelectedPostId(null)}
            onUpdatePost={updatePost}
            onDeletePost={deletePost}
          />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
